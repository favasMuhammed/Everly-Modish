<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Everly Modish | Staff Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
</head>

<body class="h-full text-slate-900">
    <div class="min-h-full">
        <!-- Navigation -->
        <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16">
                    <div class="flex items-center">
                        <span
                            class="text-2xl font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">Everly
                            Modish</span>
                        <div class="ml-10 hidden md:flex items-baseline space-x-4">
                            <a href="#"
                                class="px-3 py-2 rounded-md text-sm font-medium text-slate-900 bg-slate-100">Dashboard</a>
                            <a href="#"
                                class="px-3 py-2 rounded-md text-sm font-medium text-slate-600 hover:text-slate-900 hover:bg-slate-50">Inventory</a>
                        </div>
                    </div>
                </div>
            </div>
        </nav>

        <main class="py-10">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

                <div class="md:grid md:grid-cols-3 md:gap-8">
                    <!-- Left Column: Form -->
                    <div class="md:col-span-1">
                        <div class="sticky top-24">
                            <h2 class="text-2xl font-semibold text-slate-900 mb-6">Record New Sale</h2>
                            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                <form id="saleForm" name="submit-to-google-sheet" class="p-6 space-y-5">
                                    <div>
                                        <label class="block text-sm font-medium text-slate-700 mb-1">Customer
                                            Name</label>
                                        <input name="Customer Name" type="text" placeholder="John Doe" required
                                            class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-slate-700 mb-1">SKU Sold</label>
                                        <input name="SKU Sold" type="text" placeholder="EM-TEE-BLK" required
                                            class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none">
                                    </div>
                                    <div class="grid grid-cols-2 gap-4">
                                        <div>
                                            <label
                                                class="block text-sm font-medium text-slate-700 mb-1">Quantity</label>
                                            <input name="Qty" type="number" placeholder="1" required
                                                class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none">
                                        </div>
                                        <div>
                                            <label class="block text-sm font-medium text-slate-700 mb-1">Total
                                                Amount</label>
                                            <div class="relative">
                                                <span class="absolute left-3 top-2 text-slate-400">$</span>
                                                <input name="Total Amt" type="number" step="0.01" placeholder="0.00"
                                                    required
                                                    class="w-full pl-7 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-all outline-none">
                                            </div>
                                        </div>
                                    </div>
                                    <button type="submit" id="submitBtn"
                                        class="w-full bg-slate-900 text-white font-semibold py-3 rounded-lg hover:bg-slate-800 transform active:scale-[0.98] transition-all shadow-lg flex items-center justify-center space-x-2">
                                        <span>Record Sale</span>
                                        <svg id="loadingIcon" class="hidden animate-spin h-5 w-5 text-white"
                                            xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor"
                                                stroke-width="4"></circle>
                                            <path class="opacity-75" fill="currentColor"
                                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                                            </path>
                                        </svg>
                                    </button>
                                </form>
                                <div id="statusMsg" class="px-6 py-3 text-center text-sm font-medium hidden"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Right Column: Dashboard -->
                    <div class="md:col-span-2 mt-8 md:mt-0">
                        <div class="flex justify-between items-end mb-6">
                            <div>
                                <h2 class="text-2xl font-semibold text-slate-900">Recent Sales</h2>
                                <p class="text-slate-500 text-sm">Real-time performance from Google Sheets</p>
                            </div>
                            <button onclick="loadDashboard()"
                                class="text-indigo-600 hover:text-indigo-800 text-sm font-semibold flex items-center space-x-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                                    </path>
                                </svg>
                                <span>Refresh</span>
                            </button>
                        </div>

                        <!-- Stats Overview -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
                            <div class="bg-indigo-600 p-6 rounded-2xl shadow-md text-white">
                                <p class="text-indigo-100 text-sm font-medium">Recent Total</p>
                                <p id="recentTotalAmt" class="text-3xl font-bold mt-1">$0.00</p>
                            </div>
                            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                                <p class="text-slate-500 text-sm font-medium">Items Sold</p>
                                <p id="recentItemsCount" class="text-3xl font-bold mt-1 text-slate-900">0</p>
                            </div>
                        </div>

                        <!-- Table -->
                        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                            <div class="overflow-x-auto">
                                <table id="salesTable" class="w-full text-left">
                                    <thead>
                                        <tr
                                            class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                                            <th class="px-6 py-4">Date</th>
                                            <th class="px-6 py-4">Customer</th>
                                            <th class="px-6 py-4">SKU</th>
                                            <th class="px-6 py-4 text-right">Amount</th>
                                            <th class="px-6 py-4 text-center">Action</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-100 italic text-slate-400">
                                        <!-- Table rows will be inserted here -->
                                        <tr id="emptyState">
                                            <td colspan="4" class="px-6 py-12 text-center">
                                                <p class="text-slate-400">Loading data from Everly API...</p>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwgKi5mqYycV3O_AsKJZQJSruZTBHOBnmKaIq8eCo87yDABnlWlwdG5a2f6l3uKS1nG/exec';
        const form = document.querySelector('#saleForm');
        const submitBtn = document.querySelector('#submitBtn');
        const loadingIcon = document.querySelector('#loadingIcon');
        const statusMsg = document.querySelector('#statusMsg');

        // Form Submission
        form.addEventListener('submit', e => {
            e.preventDefault();

            // UI Feedback
            submitBtn.disabled = true;
            loadingIcon.classList.remove('hidden');
            submitBtn.classList.add('opacity-80');
            statusMsg.classList.add('hidden');

            const formData = new FormData(form);
            formData.append('action', 'create');

            fetch(scriptURL, { method: 'POST', body: formData })
                .then(response => response.json())
                .then(data => {
                    if (data.result === 'success') {
                        statusMsg.innerText = "✅ Sale recorded successfully!";
                        statusMsg.className = "px-6 py-3 text-center text-sm font-medium text-emerald-600 bg-emerald-50 block";
                        form.reset();
                        loadDashboard();
                    } else {
                        throw new Error(data.error || 'Check script URL');
                    }
                })
                .catch(error => {
                    console.error('Error!', error.message);
                    statusMsg.innerText = "❌ Error: " + error.message;
                    statusMsg.className = "px-6 py-3 text-center text-sm font-medium text-rose-600 bg-rose-50 block";
                })
                .finally(() => {
                    submitBtn.disabled = false;
                    loadingIcon.classList.add('hidden');
                    submitBtn.classList.remove('opacity-80');
                });
        });

        // Delete Row Function
        function deleteRow(rowNumber) {
            if (!confirm('Are you sure you want to delete this sale?')) return;

            const formData = new FormData();
            formData.append('action', 'delete');
            formData.append('rowNumber', rowNumber);

            // Optimistic UI update (optional, but good for UX)
            // For now, we'll just reload

            fetch(scriptURL, { method: 'POST', body: formData })
                .then(res => res.json())
                .then(data => {
                    if (data.result === 'success') {
                        alert('Sale deleted successfully');
                        loadDashboard();
                    } else {
                        alert('Error: ' + data.error);
                    }
                })
                .catch(err => console.error(err));
        }

        // Dashboard Data Loading
        function loadDashboard() {
            fetch(scriptURL)
                .then(res => res.json())
                .then(data => {
                    const tbody = document.querySelector("#salesTable tbody");
                    const recentTotalAmt = document.querySelector("#recentTotalAmt");
                    const recentItemsCount = document.querySelector("#recentItemsCount");

                    tbody.innerHTML = "";

                    // Skip header (row 0)
                    // We need to preserve the original 1-based index from the spreadsheet
                    // data[0] is header, so row 1. data[1] is row 2.
                    const rowsWithIndex = data.map((row, index) => ({ row, index: index + 1 })).slice(1);

                    // Show last 10
                    const recent = rowsWithIndex.slice(-10).reverse();

                    if (recent.length === 0) {
                        tbody.innerHTML = '<tr id="emptyState"><td colspan="5" class="px-6 py-12 text-center"><p class="text-slate-400">No sales recorded yet.</p></td></tr>';
                        return;
                    }

                    let total = 0;
                    let count = 0;

                    recent.forEach(item => {
                        const row = item.row;
                        const rowIndex = item.index;

                        // Assuming columns based on CONFIG: 
                        // Date(0), Customer(1), SKU(2), Qty(3), Total(4)
                        const date = row[0] ? new Date(row[0]).toLocaleDateString() : 'N/A';
                        const customer = row[1] || 'Guest';
                        const sku = row[2] || '---';
                        const qty = parseInt(row[3]) || 0;
                        const amt = parseFloat(row[4]) || 0;

                        total += amt;
                        count += qty;

                        const tr = document.createElement('tr');
                        tr.className = "hover:bg-slate-50 transition-colors group";
                        tr.innerHTML = `
                        <td class="px-6 py-4 text-sm text-slate-500 font-medium">${date}</td>
                        <td class="px-6 py-4 text-sm text-slate-900 font-semibold">${customer}</td>
                        <td class="px-6 py-4 text-sm text-slate-600 font-mono"><span class="bg-slate-100 px-2 py-1 rounded text-xs">${sku}</span></td>
                        <td class="px-6 py-4 text-sm text-slate-900 font-bold text-right">$${amt.toLocaleString(undefined, { minimumFractionDigits: 2 })}</td>
                        <td class="px-6 py-4 text-center">
                            <button onclick="deleteRow(${rowIndex})" class="text-slate-300 hover:text-rose-600 transition-colors p-2 rounded-full hover:bg-rose-50 opacity-0 group-hover:opacity-100 focus:opacity-100">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 000-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd" />
                                </svg>
                            </button>
                        </td>
                    `;
                        tbody.appendChild(tr);
                    });

                    // Update Stats
                    recentTotalAmt.innerText = `$${total.toLocaleString(undefined, { minimumFractionDigits: 2 })}`;
                    recentItemsCount.innerText = count;
                });
        }

        // Initial Load
        loadDashboard();
    </script>
</body>

</html>
