<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Everly Modish | Staff Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }
    </style>
</head>

<body class="h-full text-slate-900">
    <div class="min-h-full">
        <nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16 items-center">
                    <span
                        class="text-2xl font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">Everly
                        Modish</span>
                </div>
            </div>
        </nav>

        <main class="py-10">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="md:grid md:grid-cols-3 md:gap-8">

                    <div class="md:col-span-1 mb-8 md:mb-0">
                        <div class="sticky top-24">
                            <h2 class="text-2xl font-semibold text-slate-900 mb-6">Record New Sale</h2>
                            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                <form id="saleForm" class="p-6 space-y-5">
                                    <div>
                                        <label class="block text-sm font-medium text-slate-700 mb-1">Customer
                                            Name</label>
                                        <input name="Customer Name" type="text" placeholder="John Doe" required
                                            class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                                    </div>
                                    <div>
                                        <label class="block text-sm font-medium text-slate-700 mb-1">SKU Sold</label>
                                        <input name="SKU Sold" type="text" placeholder="EM-TEE-BLK" required
                                            class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                                    </div>
                                    <div class="grid grid-cols-2 gap-4">
                                        <div>
                                            <label
                                                class="block text-sm font-medium text-slate-700 mb-1">Quantity</label>
                                            <input name="Qty" type="number" placeholder="1" required
                                                class="w-full px-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                                        </div>
                                        <div>
                                            <label class="block text-sm font-medium text-slate-700 mb-1">Total
                                                Amount</label>
                                            <div class="relative">
                                                <span class="absolute left-3 top-2 text-slate-400">₹</span>
                                                <input name="Total Amt" type="number" step="0.01" placeholder="0.00"
                                                    required
                                                    class="w-full pl-7 pr-4 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                                            </div>
                                        </div>
                                    </div>
                                    <button type="submit" id="submitBtn"
                                        class="w-full bg-slate-900 text-white font-semibold py-3 rounded-lg hover:bg-slate-800 transition-all flex justify-center items-center space-x-2">
                                        <span>Record Sale</span>
                                        <svg id="loadingIcon" class="hidden animate-spin h-5 w-5 text-white"
                                            xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor"
                                                stroke-width="4"></circle>
                                            <path class="opacity-75" fill="currentColor"
                                                d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                                            </path>
                                        </svg>
                                    </button>
                                </form>
                                <div id="statusMsg" class="px-6 py-3 text-center text-sm font-medium hidden"></div>
                            </div>
                        </div>
                    </div>

                    <div class="md:col-span-2">
                        <div class="flex justify-between items-end mb-6">
                            <div>
                                <h2 class="text-2xl font-semibold text-slate-900">Recent Sales</h2>
                                <p class="text-slate-500 text-sm">Real-time performance</p>
                            </div>
                            <button onclick="loadDashboard(true)"
                                class="text-indigo-600 hover:text-indigo-800 text-sm font-semibold flex items-center space-x-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15">
                                    </path>
                                </svg>
                                <span>Refresh</span>
                            </button>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-8">
                            <div class="bg-indigo-600 p-6 rounded-2xl shadow-md text-white">
                                <p class="text-indigo-100 text-sm font-medium">Recent Total</p>
                                <p id="recentTotalAmt" class="text-3xl font-bold mt-1">₹0.00</p>
                            </div>
                            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                                <p class="text-slate-500 text-sm font-medium">Items Sold</p>
                                <p id="recentItemsCount" class="text-3xl font-bold mt-1 text-slate-900">0</p>
                            </div>
                        </div>

                        <div
                            class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden overflow-x-auto">
                            <table id="salesTable" class="w-full text-left min-w-[600px]">
                                <thead>
                                    <tr
                                        class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase tracking-wider">
                                        <th class="px-6 py-4">Date</th>
                                        <th class="px-6 py-4">Customer</th>
                                        <th class="px-6 py-4">SKU</th>
                                        <th class="px-6 py-4 text-right">Amount</th>
                                        <th class="px-6 py-4 text-center">Action</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100">
                                    <tr id="emptyState">
                                        <td colspan="5" class="px-6 py-12 text-center text-slate-400">Loading data...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // --- REPLACE THIS WITH YOUR NEW APPS SCRIPT URL ---
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwgKi5mqYycV3O_AsKJZQJSruZTBHOBnmKaIq8eCo87yDABnlWlwdG5a2f6l3uKS1nG/exec';
        // --------------------------------------------------

        const form = document.querySelector('#saleForm');
        const submitBtn = document.querySelector('#submitBtn');
        const loadingIcon = document.querySelector('#loadingIcon');
        const statusMsg = document.querySelector('#statusMsg');
        const tbody = document.querySelector("#salesTable tbody");

        // Format Currency
        const formatMoney = (amount) => `₹${parseFloat(amount).toLocaleString('en-IN', { minimumFractionDigits: 2 })}`;

        // Handle Form Submit
        form.addEventListener('submit', e => {
            e.preventDefault();
            submitBtn.disabled = true;
            loadingIcon.classList.remove('hidden');
            submitBtn.classList.add('opacity-80');
            statusMsg.classList.add('hidden');

            const formData = new FormData(form);
            formData.append('action', 'create');

            fetch(scriptURL, { method: 'POST', body: formData })
                .then(response => response.json())
                .then(data => {
                    if (data.result === 'success') {
                        statusMsg.innerText = "✅ Sale recorded successfully!";
                        statusMsg.className = "px-6 py-3 text-center text-sm font-medium text-emerald-600 bg-emerald-50 block";
                        form.reset();
                        loadDashboard(true); // Force fresh fetch
                    } else { throw new Error(data.error); }
                })
                .catch(error => {
                    statusMsg.innerText = "❌ Error: " + error.message;
                    statusMsg.className = "px-6 py-3 text-center text-sm font-medium text-rose-600 bg-rose-50 block";
                })
                .finally(() => {
                    submitBtn.disabled = false;
                    loadingIcon.classList.add('hidden');
                    submitBtn.classList.remove('opacity-80');
                    setTimeout(() => statusMsg.classList.add('hidden'), 4000);
                });
        });

        // Delete Row (Optimistic UI)
        window.deleteRow = function (rowNumber, btnElement) {
            if (!confirm('Are you sure you want to delete this sale?')) return;

            const rowElement = btnElement.closest('tr');
            rowElement.style.opacity = '0.5'; // Visual feedback

            const formData = new FormData();
            formData.append('action', 'delete');
            formData.append('rowNumber', rowNumber);

            fetch(scriptURL, { method: 'POST', body: formData })
                .then(res => res.json())
                .then(data => {
                    if (data.result === 'success') {
                        loadDashboard(true); // Refresh quietly
                    } else {
                        rowElement.style.opacity = '1';
                        alert('Error deleting row');
                    }
                });
        };

        // Render Table Data
        function renderTable(data) {
            tbody.innerHTML = "";
            const rowsWithIndex = data.map((row, index) => ({ row, index: index + 1 })).slice(1);
            const recent = rowsWithIndex.slice(-10).reverse();

            if (recent.length === 0) {
                tbody.innerHTML = '<tr id="emptyState"><td colspan="5" class="px-6 py-12 text-center text-slate-400">No sales recorded yet.</td></tr>';
                return;
            }

            let total = 0, count = 0;

            recent.forEach(item => {
                const { row, index: rowIndex } = item;
                const date = row[0] ? new Date(row[0]).toLocaleDateString('en-IN') : 'N/A';
                const customer = row[1] || 'Guest';
                const sku = row[2] || '---';
                const qty = parseInt(row[3]) || 0;
                const amt = parseFloat(row[4]) || 0;

                total += amt; count += qty;

                tbody.insertAdjacentHTML('beforeend', `
                    <tr class="hover:bg-slate-50 transition-colors group">
                        <td class="px-6 py-4 text-sm text-slate-500 font-medium">${date}</td>
                        <td class="px-6 py-4 text-sm text-slate-900 font-semibold">${customer}</td>
                        <td class="px-6 py-4 text-sm text-slate-600 font-mono"><span class="bg-slate-100 px-2 py-1 rounded text-xs">${sku}</span></td>
                        <td class="px-6 py-4 text-sm text-slate-900 font-bold text-right">${formatMoney(amt)}</td>
                        <td class="px-6 py-4 text-center">
                            <button onclick="deleteRow(${rowIndex}, this)" class="text-slate-400 hover:text-rose-600 transition-colors">
                                <svg class="h-5 w-5 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                            </button>
                        </td>
                    </tr>
                `);
            });

            document.querySelector("#recentTotalAmt").innerText = formatMoney(total);
            document.querySelector("#recentItemsCount").innerText = count;
        }

        // Load Data (Local Cache + Fetch)
        function loadDashboard(forceFetch = false) {
            const cached = localStorage.getItem('everlyData');
            if (cached && !forceFetch) renderTable(JSON.parse(cached));

            fetch(scriptURL)
                .then(res => res.json())
                .then(data => {
                    localStorage.setItem('everlyData', JSON.stringify(data));
                    renderTable(data);
                })
                .catch(err => console.error("Fetch Error:", err));
        }

        loadDashboard();
    </script>
</body>

</html>
